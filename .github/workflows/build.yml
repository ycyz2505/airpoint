name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install
        run: pip install -r requirements.txt

      - name: Test
        run: python -m unittest discover -s tests -v

      - name: Build
        run: pyinstaller --noconfirm OpticalInputSvc.spec

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $v = python -c "import sys; sys.path.insert(0,'src'); from airpoint.version import __version__; print(__version__)"
          "value=$($v.Trim())" >> $env:GITHUB_OUTPUT

      - name: Manifest
        run: >
          python tools/make_manifest.py
          --exe dist/OpticalInputSvc.exe
          --version ${{ steps.version.outputs.value }}
          --repo ${{ github.repository }}
          --out manifest.json

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpticalInputSvc
          path: |
            dist/OpticalInputSvc.exe
            manifest.json
          if-no-files-found: error

      - name: Publish latest build
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-latest
          name: Latest build
          body: |
            Built by GitHub Actions from `main`.

            The app checks this release's `manifest.json` on startup and
            updates itself through the configured GitHub mirrors.
          files: |
            dist/OpticalInputSvc.exe
            manifest.json
          overwrite_files: true
          make_latest: true

      - name: Publish versioned release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/OpticalInputSvc.exe
            manifest.json
          generate_release_notes: true
